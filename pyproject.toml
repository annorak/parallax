[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "pyyaml",
    "browser-use==0.13.10",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["parallax"]
